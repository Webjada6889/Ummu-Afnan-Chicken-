<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="UMMU AFNAN Chicken - Quality live chickens available in Gombe, Nigeria. Order live broilers, layers, cockerels, local chickens and young chickens."
  >

  <meta
    name="theme-color"
    content="#7b241c"
  >

  <title>Order Live Chickens | UMMU AFNAN Chicken</title>

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f7f8f5;
      color: #20251f;
      line-height: 1.6;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }


    /* =========================================================
       VARIABLES
    ========================================================= */

    :root {
      --primary: #7b241c;
      --primary-dark: #5f1914;
      --primary-light: #f4e8e5;

      --green: #172117;
      --green-light: #eaf0e8;

      --gold: #d69b3d;

      --text: #20251f;
      --muted: #697066;

      --white: #ffffff;
      --border: #e2e6df;

      --shadow:
        0 10px 30px rgba(0, 0, 0, 0.07);

      --radius: 20px;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: rgba(255, 255, 255, 0.97);

      border-bottom:
        1px solid var(--border);

      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.06);

      backdrop-filter: blur(12px);
    }

    .nav {
      width: min(1200px, 92%);
      min-height: 78px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;

      gap: 12px;

      flex-shrink: 0;
    }

    .logo {
      width: 55px;
      height: 55px;

      object-fit: contain;

      border-radius: 50%;
    }

    .brand-text {
      display: flex;
      flex-direction: column;

      line-height: 1.05;
    }

    .brand-text strong {
      font-size: 18px;
      letter-spacing: 1px;

      color: var(--green);
    }

    .brand-text small {
      margin-top: 5px;

      font-size: 11px;
      letter-spacing: 3px;

      color: var(--primary);

      font-weight: bold;
    }

    .nav-links {
      display: flex;
      align-items: center;

      gap: 20px;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 600;

      color: #42483f;

      transition: 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .nav-order {
      padding: 11px 18px;

      border-radius: 30px;

      background: var(--primary);

      color: white !important;
    }

    .nav-order:hover {
      background: var(--primary-dark) !important;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 470px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      position: relative;

      color: white;

      background:
        linear-gradient(
          rgba(15, 25, 14, 0.78),
          rgba(65, 20, 15, 0.72)
        ),
        url("photo.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .hero-content {
      width: min(850px, 92%);

      padding: 70px 20px;
    }

    .hero-badge {
      display: inline-block;

      padding: 9px 18px;

      border:
        1px solid rgba(255, 255, 255, 0.45);

      border-radius: 50px;

      background:
        rgba(255, 255, 255, 0.09);

      font-size: 13px;
      font-weight: bold;

      letter-spacing: 1.5px;

      margin-bottom: 20px;
    }

    .hero h1 {
      font-size:
        clamp(38px, 6vw, 68px);

      line-height: 1.05;

      margin-bottom: 20px;

      letter-spacing: -1px;
    }

    .hero h1 span {
      color: #f1c27d;
    }

    .hero p {
      max-width: 680px;

      margin: auto;

      font-size:
        clamp(16px, 2vw, 20px);

      color: #f5f5f5;
    }

    .hero-buttons {
      margin-top: 30px;

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 12px;
    }

    .hero-btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 170px;

      padding: 14px 22px;

      border-radius: 12px;

      font-weight: bold;

      transition: 0.25s ease;
    }

    .hero-btn-primary {
      background: white;
      color: var(--primary);
    }

    .hero-btn-primary:hover {
      transform: translateY(-2px);
    }

    .hero-btn-secondary {
      border:
        1px solid rgba(255, 255, 255, 0.45);

      background:
        rgba(255, 255, 255, 0.08);

      color: white;
    }

    .hero-btn-secondary:hover {
      background:
        rgba(255, 255, 255, 0.15);
    }


    /* =========================================================
       GENERAL
    ========================================================= */

    .container {
      width: min(1200px, 92%);
      margin: auto;
    }

    .section {
      padding: 70px 0;
    }

    .section-title {
      text-align: center;

      margin-bottom: 40px;
    }

    .section-title small {
      display: block;

      color: var(--primary);

      font-weight: bold;

      letter-spacing: 2px;

      text-transform: uppercase;

      margin-bottom: 8px;
    }

    .section-title h2 {
      font-size:
        clamp(28px, 4vw, 42px);

      color: #1c251b;

      margin-bottom: 10px;
    }

    .section-title p {
      max-width: 680px;

      margin: auto;

      color: var(--muted);
    }


    /* =========================================================
       NOTICE
    ========================================================= */

    .info-box {
      background: white;

      border:
        1px solid var(--border);

      border-radius: 18px;

      padding: 22px;

      margin-bottom: 35px;

      display: flex;
      align-items: center;

      gap: 18px;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.04);
    }

    .info-icon {
      width: 58px;
      height: 58px;

      flex-shrink: 0;

      display: grid;
      place-items: center;

      background: var(--primary-light);

      border-radius: 50%;

      font-size: 27px;
    }

    .info-box strong {
      display: block;

      margin-bottom: 4px;

      color: #1c251b;

      font-size: 17px;
    }

    .info-box p {
      color: var(--muted);

      font-size: 14px;
    }


    /* =========================================================
       PRODUCTS GRID
    ========================================================= */

    .products-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 25px;

      align-items: stretch;
    }


    /* =========================================================
       PRODUCT CARD
    ========================================================= */

    .product-card {
      background: white;

      border:
        1px solid var(--border);

      border-radius: var(--radius);

      overflow: hidden;

      box-shadow: var(--shadow);

      display: flex;
      flex-direction: column;

      min-width: 0;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);

      box-shadow:
        0 16px 35px rgba(0, 0, 0, 0.10);
    }


    /* =========================================================
       PRODUCT IMAGE
    ========================================================= */

    .product-image {
      width: 100%;

      height: 235px;

      overflow: hidden;

      background: #f1f2ef;

      flex-shrink: 0;

      position: relative;
    }

    .product-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      object-position: center;

      transition:
        transform 0.4s ease;
    }

    .product-card:hover
    .product-image img {
      transform: scale(1.04);
    }

    .product-badge {
      position: absolute;

      top: 14px;
      left: 14px;

      padding: 6px 11px;

      border-radius: 30px;

      background: rgba(123, 36, 28, 0.94);

      color: white;

      font-size: 11px;

      font-weight: bold;

      letter-spacing: 0.5px;
    }


    /* =========================================================
       PRODUCT CONTENT
    ========================================================= */

    .product-content {
      padding: 22px;

      display: flex;
      flex-direction: column;

      flex: 1;

      background: white;
    }

    .product-content h3 {
      margin: 0 0 9px;

      font-size: 21px;

      line-height: 1.3;

      color: #111;
    }

    .product-description {
      margin: 0 0 18px;

      color: #666;

      font-size: 14px;

      line-height: 1.6;

      min-height: 45px;
    }


    /* =========================================================
       PRICE
    ========================================================= */

    .price {
      margin-bottom: 18px;

      font-size: 23px;

      font-weight: 800;

      color: var(--primary);
    }

    .price span {
      font-size: 12px;

      font-weight: 500;

      color: #555;
    }


    /* =========================================================
       QUANTITY
    ========================================================= */

    .quantity-box {
      margin-top: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      border:
        1px solid #ddd;

      border-radius: 12px;

      padding: 7px;

      background: #fafafa;
    }

    .quantity-box button {
      width: 40px;
      height: 40px;

      border: none;

      border-radius: 9px;

      background: var(--primary);

      color: white;

      font-size: 23px;

      font-weight: bold;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: 0.2s ease;
    }

    .quantity-box button:hover {
      background: var(--primary-dark);

      transform: scale(1.04);
    }

    .quantity {
      min-width: 35px;

      text-align: center;

      font-size: 18px;

      font-weight: 800;

      color: #111;
    }


    /* =========================================================
       ORDER AREA
    ========================================================= */

    .order-area {
      display: grid;

      grid-template-columns:
        minmax(0, 1.3fr)
        minmax(320px, 0.8fr);

      gap: 28px;

      align-items: start;
    }

    .card {
      background: white;

      border:
        1px solid var(--border);

      border-radius: 20px;

      padding: 28px;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.05);
    }

    .card h3 {
      font-size: 23px;

      margin-bottom: 20px;

      color: #20291f;
    }


    /* =========================================================
       CART
    ========================================================= */

    .cart-card {
      position: sticky;

      top: 100px;
    }

    .cart-empty {
      text-align: center;

      padding: 30px 10px;

      color: #7b8178;
    }

    .cart-empty-icon {
      font-size: 48px;

      margin-bottom: 10px;
    }

    .cart-item {
      display: grid;

      grid-template-columns:
        1fr auto;

      gap: 15px;

      padding: 15px 0;

      border-bottom:
        1px solid #eceee9;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item-name {
      font-weight: 700;

      color: #20291f;
    }

    .cart-item-details {
      font-size: 13px;

      color: #737970;

      margin-top: 3px;
    }

    .cart-item-price {
      font-weight: 800;

      color: var(--primary);

      white-space: nowrap;
    }

    .summary-row {
      display: flex;

      justify-content: space-between;

      gap: 15px;

      padding: 10px 0;

      color: #555d52;
    }

    .summary-row.total {
      border-top:
        2px solid #e5e8e1;

      margin-top: 10px;

      padding-top: 18px;

      font-size: 21px;

      font-weight: 800;

      color: #1c251b;
    }

    .summary-row.total strong {
      color: var(--primary);
    }


    /* =========================================================
       FORM
    ========================================================= */

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;

      font-size: 14px;

      font-weight: 700;

      margin-bottom: 7px;

      color: #333a30;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;

      padding: 13px 14px;

      border:
        1px solid #d9ded5;

      border-radius: 11px;

      outline: none;

      background: white;

      color: #222;

      transition: 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px
        rgba(123, 36, 28, 0.08);
    }

    .form-group textarea {
      resize: vertical;

      min-height: 105px;
    }


    /* =========================================================
       RADIO OPTIONS
    ========================================================= */

    .radio-group {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;
    }

    .radio-option {
      border:
        1px solid #dce1d8;

      border-radius: 12px;

      padding: 13px;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .radio-option:hover {
      border-color: var(--primary);

      background: #fffaf9;
    }

    .radio-option input {
      margin-right: 7px;

      accent-color: var(--primary);
    }

    .radio-option label {
      cursor: pointer;

      font-weight: 600;

      font-size: 14px;
    }


    /* =========================================================
       BUTTONS
    ========================================================= */

    .submit-btn {
      width: 100%;

      border: none;

      padding: 16px 20px;

      border-radius: 13px;

      background: var(--primary);

      color: white;

      font-size: 16px;

      font-weight: 800;

      transition: 0.25s ease;

      margin-top: 8px;
    }

    .submit-btn:hover {
      background: var(--primary-dark);

      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      background: #b5bab2;

      cursor: not-allowed;

      transform: none;
    }

    .clear-btn {
      width: 100%;

      border:
        1px solid #d9ded5;

      background: white;

      color: #555d52;

      padding: 12px;

      border-radius: 12px;

      margin-top: 12px;

      font-weight: 700;
    }

    .clear-btn:hover {
      border-color: var(--primary);

      color: var(--primary);
    }


    /* =========================================================
       WHATSAPP BUTTON
    ========================================================= */

    .whatsapp-btn {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      width: 100%;

      margin-top: 12px;

      padding: 14px;

      border-radius: 12px;

      background: #1f9d55;

      color: white;

      font-weight: 800;

      border: none;
    }

    .whatsapp-btn:hover {
      background: #188346;
    }


    /* =========================================================
       DELIVERY NOTE
    ========================================================= */

    .delivery-note {
      margin-top: 15px;

      padding: 14px;

      background: #f8f4f2;

      border-radius: 12px;

      font-size: 13px;

      color: #666c63;
    }


    /* =========================================================
       SUCCESS MESSAGE
    ========================================================= */

    .success-message {
      display: none;

      background: #e8f5e9;

      color: #245b2a;

      border:
        1px solid #b8dbbd;

      padding: 14px;

      border-radius: 12px;

      margin-bottom: 20px;

      font-size: 14px;

      font-weight: 600;
    }


    /* =========================================================
       SOUND BUTTON
    ========================================================= */

    .sound-button {
      position: fixed;

      right: 20px;
      bottom: 20px;

      z-index: 2000;

      width: 52px;
      height: 52px;

      border: none;

      border-radius: 50%;

      background: var(--primary);

      color: white;

      font-size: 21px;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.22);

      transition: 0.2s ease;
    }

    .sound-button:hover {
      transform: scale(1.06);
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {
      background: var(--green);

      color: white;

      padding: 45px 0 25px;

      text-align: center;

      margin-top: 20px;
    }

    .footer-logo {
      width: 65px;
      height: 65px;

      object-fit: contain;

      margin:
        0 auto 12px;

      border-radius: 50%;
    }

    .footer h3 {
      margin-bottom: 7px;

      font-size: 20px;
    }

    .footer p {
      color: #c6ccc3;

      font-size: 14px;

      margin-bottom: 20px;
    }

    .footer-contact {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px 25px;

      margin-bottom: 25px;

      font-size: 14px;
    }

    .footer-contact a:hover {
      color: #f1c27d;
    }

    .powered {
      border-top:
        1px solid rgba(255, 255, 255, 0.12);

      padding-top: 18px;

      font-size: 13px;

      color: #aeb6aa;
    }

    .powered strong {
      color: white;
    }


    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 1000px) {

      .products-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .order-area {
        grid-template-columns: 1fr;
      }

      .cart-card {
        position: static;

        order: -1;
      }

      .hero {
        min-height: 420px;
      }
    }


    /* =========================================================
       IPAD / TABLET PORTRAIT
    ========================================================= */

    @media (max-width: 760px) {

      .nav {
        min-height: 70px;
      }

      .nav-links {
        gap: 10px;
      }

      .nav-links a:not(.nav-order) {
        display: none;
      }

      .brand-text strong {
        font-size: 16px;
      }

      .logo {
        width: 48px;
        height: 48px;
      }

      .hero {
        min-height: 390px;
      }

      .hero-content {
        padding: 55px 15px;
      }

      .products-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .product-image {
        height: 210px;
      }

      .section {
        padding: 55px 0;
      }
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 560px) {

      .container {
        width: min(94%, 500px);
      }

      .nav {
        width: 94%;
      }

      .brand-text small {
        font-size: 9px;

        letter-spacing: 2px;
      }

      .nav-order {
        padding: 9px 13px;

        font-size: 12px !important;
      }

      .hero {
        min-height: 390px;
      }

      .hero-badge {
        font-size: 10px;

        letter-spacing: 1px;
      }

      .hero h1 {
        font-size: 39px;
      }

      .hero p {
        font-size: 15px;
      }

      .hero-buttons {
        flex-direction: column;

        align-items: stretch;

        max-width: 320px;

        margin-left: auto;
        margin-right: auto;
      }

      .hero-btn {
        width: 100%;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }

      .product-image {
        height: 245px;
      }

      .product-content {
        padding: 20px;
      }

      .order-area {
        gap: 18px;
      }

      .card {
        padding: 20px;

        border-radius: 16px;
      }

      .radio-group {
        grid-template-columns: 1fr;
      }

      .info-box {
        align-items: flex-start;

        padding: 17px;
      }

      .sound-button {
        right: 15px;

        bottom: 15px;

        width: 46px;
        height: 46px;
      }

      .footer-contact {
        flex-direction: column;

        gap: 8px;
      }
    }


    /* =========================================================
       SMALL PHONES
    ========================================================= */

    @media (max-width: 380px) {

      .brand-text {
        display: none;
      }

      .logo {
        width: 45px;
        height: 45px;
      }

      .hero h1 {
        font-size: 34px;
      }

      .section-title h2 {
        font-size: 27px;
      }

      .product-image {
        height: 220px;
      }
    }


    /* =========================================================
   RESPONSIVE DESIGN
   UMMU AFNAN CHICKEN
========================================================= */


/* =========================================================
   LARGE DESKTOP
   1400px+
========================================================= */

@media (min-width: 1400px) {

  .container,
  .nav {
    width: min(1280px, 90%);
  }

  .products-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
  }

  .product-image {
    height: 250px;
  }

  .hero {
    min-height: 560px;
  }

  .hero h1 {
    font-size: 72px;
  }

}


/* =========================================================
   DESKTOP
   1200px - 1399px
========================================================= */

@media (min-width: 1200px) and (max-width: 1399px) {

  .container,
  .nav {
    width: 92%;
  }

  .products-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
  }

  .product-image {
    height: 230px;
  }

}


/* =========================================================
   LAPTOP
   1001px - 1199px
========================================================= */

@media (min-width: 1001px) and (max-width: 1199px) {

  .container,
  .nav {
    width: 93%;
  }

  .products-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  .product-image {
    height: 210px;
  }

  .product-content {
    padding: 18px;
  }

  .product-content h3 {
    font-size: 19px;
  }

  .hero {
    min-height: 450px;
  }

  .hero h1 {
    font-size: 55px;
  }

  .order-area {
    grid-template-columns: 1.2fr 0.8fr;
    gap: 20px;
  }

}


/* =========================================================
   TABLET LANDSCAPE
   900px - 1000px
========================================================= */

@media (min-width: 900px) and (max-width: 1000px) {

  .container,
  .nav {
    width: 93%;
  }

  .products-grid {
    grid-template-columns: repeat(2, 1fr);
